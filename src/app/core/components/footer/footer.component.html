<ion-footer class="gg-footer">
    <div class="gg-footer__content">
        <gg-mega-menu></gg-mega-menu>
        <img class="gg-footer__content-image" src="assets/svgs/happy-gator-silouette.svg">
    </div>
    <div class="gg-footer__contact">
        <ion-list class="gg-footer__contact-list" lines="none">
            <ion-item class="gg-footer__contact-address" href="https://maps.app.goo.gl/gKvPw7DbdUic4U9x8">
                <ion-icon name="navigate" color="primary"></ion-icon>
                120 Kelsey Ct, Myrtle Beach, SC 29588
            </ion-item>
            <ion-item class="gg-footer__phone" (click)="call($event)" href="#">
                <ion-icon color="primary" name="phone-portrait"></ion-icon>
                <span class="gg-footer__phone-number"></span>
            </ion-item>
            <ion-item class="gg-footer__email" (click)="email($event)" href="#">
                <ion-icon color="primary" name="mail"></ion-icon>
                <span class="gg-footer__email-address"></span>
            </ion-item>
        </ion-list>
    </div>
</ion-footer>
